[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-cleaner"
version = "0.1.0"
description = "Local Gmail cleanup tool with inventory, dry-run and resumable deletion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "tqdm>=4.67.0",
]

[project.scripts]
save_to_csv = "gmail_cleaner.cli:save_to_csv"
analyze_inventory = "gmail_cleaner.cli:analyze_inventory_cli"
clean_inventory = "gmail_cleaner.cli:clean_inventory_cli"

[tool.setuptools.packages.find]
where = ["src"]
